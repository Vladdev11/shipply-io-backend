query GetProductVariants($first: Int!, $cursor: String) {
  productVariants(first: $first, after: $cursor) {
    edges {
      node {
        id
        image {
          url
        }
        inventoryItem {
          id
          countryCodeOfOrigin
          duplicateSkuCount
          harmonizedSystemCode
          inventoryHistoryUrl
          locationsCount
          provinceCodeOfOrigin
          requiresShipping
          sku
          tracked
          unitCost {
            amount
            currencyCode
          }
        }
        inventoryPolicy
        inventoryQuantity
        price
        product {
          status
          description
          handle
          id
          priceRange {
            maxVariantPrice {
              currencyCode
            }
          }
          productType
          publishedAt
          tags
          title
          updatedAt
          vendor
          onlineStoreUrl
          images(first: 1) {
            edges {
              node {
                id
                src
              }
            }
          }
        }
        barcode
        sku
        taxCode
        taxable
        title
        updatedAt
        weight
        weightUnit
        requiresShipping
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

