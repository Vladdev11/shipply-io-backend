query GetOrders($first: Int!, $cursor: String) {
  orders(first: $first, after: $cursor) {
    edges {
      node {
        id
        canNotifyCustomer
        cancelReason
        cancelledAt
        clientIp
        closed
        closedAt
        confirmed
        currencyCode
        customAttributes {
          key
          value
        }
        subtotalPriceSet {
          shopMoney {
            amount
          }
        }
        totalDiscountsSet {
          shopMoney {
            amount
          }
        }
        totalPriceSet {
          shopMoney {
            amount
            currencyCode
          }
        }
        totalShippingPriceSet {
          shopMoney {
            amount
          }
        }
        totalTaxSet {
          shopMoney {
            amount
          }
        }
        totalTipReceivedSet {
          shopMoney {
            amount
          }
        }
        email
        displayFinancialStatus
        displayFulfillmentStatus
        edited
        fulfillable
        name
        note
        phone
        refundable
        refunds {
          id
        }
        requiresShipping
        shippingLine {
          custom
          code
          price
          title
          carrierIdentifier
          phone
          source
          discountedPriceSet {
            shopMoney {
              amount
              currencyCode
            }
          }
        }
        riskLevel
        tags
        physicalLocation {
          name
        }
        billingAddress {
          ...AddressInfo
        }
        shippingAddress {
          ...AddressInfo
        }
        createdAt
        discountCodes
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

