query GetLineItemsByOrderID($orderID: ID!, $first: Int!, $cursor: String) {
  order(id: $orderID) {
    lineItems(first: $first, after: $cursor) {
      edges {
        node {
          id
          image {
            url
          }
          quantity
          currentQuantity
          nonFulfillableQuantity
          unfulfilledQuantity
          fulfillmentStatus
          name
          originalTotalSet {
            shopMoney {
              amount
              currencyCode
            }
          }
          originalUnitPriceSet {
            shopMoney {
              amount
              currencyCode
            }
          }
          requiresShipping
          sku
          title
          variantTitle
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

query GetLocationsByName($name: String!) {
  locations(first: 1, query: $name) {
    edges {
      node {
        id
        name
      }
    }
  }
}

